[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "douyin-summary-mcp"
version = "0.1.0"
description = "Standalone authenticated MCP for douyin-summary-mcp"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/douyin_summary_mcp/vendor/f2/LICENSE", "src/douyin_summary_mcp/vendor/f2/NOTICE.md"]
dependencies = ["cryptography==46.0.3", "fastmcp==4.0.5", "httpx==0.28.1", "mcp==2.2.0", "pydantic==2.12.5", "py-key-value-aio==0.4.6", "gmssl==3.2.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[project.scripts]
douyin-summary-mcp = "douyin_summary_mcp.server:main"
douyin-summary-mcp-admin = "douyin_summary_mcp.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_summary_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
